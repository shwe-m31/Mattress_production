server.port=${PORT:8080}

# MySQL database configuration - uses environment variables for cloud deployment
# For local development, you can set these in your system or update defaults below
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mattress_production?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql@12345}
# spring.jpa.database-platform is automatically detected in Spring Boot 3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Timezone configuration
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Production window configuration
production.start-time=09:00
production.end-time=17:00

# Production target configuration
production.daily-target=500
production.weekly-target=2500
production.monthly-target=10000

# Production rate configuration (units per hour)
production.rate=65

# Simulation configuration
simulation.sync-interval=60000
simulation.history-days=30
simulation.time-multiplier=30
simulation.enabled=true

# Alert configuration
alerts.low-production-threshold=0.8