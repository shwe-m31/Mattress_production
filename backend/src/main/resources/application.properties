server.port=${PORT:8080}

# H2 in-memory database for hackathon demo
spring.datasource.url=jdbc:h2:mem:peps_production;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

simulation.interval=10000
simulation.initial-delay=10000
simulation.seed-hours=10
production.daily-target=120