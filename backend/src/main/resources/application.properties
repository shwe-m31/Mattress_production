server.port=8080

# Set these values for the local MySQL installation before running the backend.
spring.datasource.url=jdbc:mysql://localhost:3306/peps_production_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

simulation.interval=10000
simulation.initial-delay=10000
simulation.seed-hours=10
production.daily-target=120
