server.port=${PORT:8080}

# Database configuration - use environment variables for production
# For local development, set DB_URL, DB_USERNAME, DB_PASSWORD in your environment
# Example local: DB_URL=jdbc:mysql://localhost:3306/peps_production_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

simulation.interval=10000
simulation.initial-delay=10000
simulation.seed-hours=10
production.daily-target=120