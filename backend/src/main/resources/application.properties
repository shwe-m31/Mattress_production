server.port=8080

# Override DB_URL, DB_USERNAME, and DB_PASSWORD in the environment when needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/peps_production_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

simulation.interval=10000
simulation.initial-delay=10000
simulation.seed-hours=10
production.daily-target=120
